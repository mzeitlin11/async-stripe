[package]
name = "async-stripe-client-core"
version.workspace = true
description.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
readme.workspace = true
homepage.workspace = true
repository.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true
edition.workspace = true

[lib]
name = "stripe_client_core"

[dependencies]
async-stripe-shared = { path = "../generated/async-stripe-shared", version = "1.0.0-rc.9", optional = true }
async-stripe-types = { path = "../async-stripe-types", version = "1.0.0-rc.9" }
serde_json.workspace = true
serde.workspace = true
serde_qs.workspace = true
bytes = "1.6.0"
miniserde.workspace = true
futures-util = "0.3.28"
uuid = { version = "1.6.1", optional = true, features = ["v4"] }
tracing = "0.1.40"
thiserror = "2.0.11"
percent-encoding = { version = "2", optional = true }
hmac = { version = "0.13", optional = true }
sha2 = { version = "0.11", optional = true }
hex = { version = "0.4", optional = true }

[features]
default = ["v1"]
v1 = ["dep:async-stripe-shared"]
v2 = ["uuid", "dep:percent-encoding"]
webhook-signatures = ["dep:hmac", "dep:sha2", "dep:hex"]
redact-generated-debug = ["async-stripe-shared?/redact-generated-debug", "async-stripe-types/redact-generated-debug"]
