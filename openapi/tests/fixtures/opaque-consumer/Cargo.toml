[package]
name = "opaque-consumer"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
stripe = { package = "async-stripe", path = "../../../../async-stripe", default-features = false }
stripe-client-core = { package = "async-stripe-client-core", path = "../../../../async-stripe-client-core" }
bytes = "1.6.0"
miniserde = "0.1.34"
serde_json = "1"

[features]
default = ["balance_transaction"]
balance_transaction = ["stripe/balance_transaction"]
charge = ["stripe/charge"]
invoice = ["stripe/invoice"]
balance_transaction_source = ["stripe/balance_transaction_source"]
application = ["stripe/application"]
deleted_customer = ["stripe/deleted_customer"]
customer = ["stripe/customer"]
rule = ["stripe/rule"]
payment_method = ["stripe/payment_method"]
payment_intent = ["stripe/payment_intent"]
source = ["stripe/source"]
treasury_transaction = ["stripe/treasury_transaction"]
payment_decoders = ["stripe/payment_decoders"]
core_decoders = ["stripe/core_decoders"]
issuing_decoders = ["stripe/issuing_decoders"]
payment_method_details_card = ["stripe/payment_method_details_card"]
payment_method_details_ideal = ["stripe/payment_method_details_ideal"]
serialize = ["stripe/serialize"]
deserialize = ["stripe/deserialize"]
redact-generated-debug = ["stripe/redact-generated-debug"]
# This probe must fail without `charge` and succeed when `charge` is enabled.
charge-compile-probe = []
record-card-compile-probe = []

[[bin]]
name = "charge-compile-probe"
path = "src/charge_compile_probe.rs"
required-features = ["charge-compile-probe"]

[[bin]]
name = "record-card-compile-probe"
path = "src/record_card_compile_probe.rs"
required-features = ["record-card-compile-probe"]
