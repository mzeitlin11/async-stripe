[package]
name = "opaque-webhook-consumer"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
stripe-webhook = { package = "async-stripe-webhook", path = "../../../../async-stripe-webhook", default-features = false }

[dev-dependencies]
miniserde = "0.1.34"
serde_json = "1.0"

[features]
charge = ["stripe-webhook/charge"]
serialize = ["stripe-webhook/serialize"]
deserialize = ["stripe-webhook/deserialize"]
redact-generated-debug = ["stripe-webhook/redact-generated-debug"]
